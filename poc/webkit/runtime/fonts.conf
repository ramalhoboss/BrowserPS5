<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Fontconfig setup for WebKit on the PS5, installed by package.sh as
  /user/homebrew/etc/fonts/fonts.conf (the path the deps build compiled
  into libfontconfig). The fonts are DejaVu, from Ubuntu's fonts-dejavu
  packages (free license, copied next to them as LICENSE).

  DejaVu has no Chinese, Japanese or Korean. For those characters
  fontconfig falls back to the fonts the console itself has in
  /preinst/common/font (read in place, nothing of them is in the project);
  the aliases below keep DejaVu first for everything else.
-->
<fontconfig>
  <dir>/user/homebrew/share/fonts</dir>
  <dir>/preinst/common/font</dir>
  <cachedir>/user/homebrew/var/cache/fontconfig</cachedir>

  <alias>
    <family>sans-serif</family>
    <prefer><family>DejaVu Sans</family></prefer>
  </alias>
  <alias>
    <family>serif</family>
    <prefer><family>DejaVu Serif</family></prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer><family>DejaVu Sans Mono</family></prefer>
  </alias>
</fontconfig>
