<!doctype html>
<!-- Copyright (C) 2026 BrowserPS5 contributors. GPL-3.0-or-later.

The radial menus (L2 and R2), a page of their own drawn by WebKit in a
RADIAL_SIZE square in the middle of the screen (main.cpp; the app cuts it
round, puts a little of the page through it and darkens the screen under
it). Eight sectors from the top clockwise; the app says which ring
(show(state)), which sector the stick or the D-pad points at (pick(i), -1
none) and does it itself: this page only shows. hide() empties it, so the
next opening never shows the last one's frame. docs/07, "Menus radiais". -->
<html data-theme="meia-noite"><head><meta charset="utf-8"><style>
<!--#include theme.css-->
html, body { width: 720px; height: 720px; }
body {
  position: relative; font-size: 20px;
  background:
    repeating-linear-gradient(0deg, rgba(255, 255, 255, .018) 0 1px, transparent 1px 4px),
    radial-gradient(circle at 50% 34%, var(--accent-soft), transparent 68%),
    radial-gradient(circle at 50% 50%, var(--surface-2) 0, var(--surface) 72%);
}
#all { position: absolute; inset: 0; }
body.hidden #all { visibility: hidden; }

/* The rings and the spokes between the sectors. */
.orbit { position: absolute; border-radius: 50%; pointer-events: none; }
#rim {
  inset: 10px; border: 2px solid color-mix(in srgb, var(--accent) 34%, transparent);
  box-shadow: inset 0 0 70px var(--accent-soft), 0 0 24px var(--accent-soft);
}
#inner { inset: 212px; border: 1px solid var(--line-2); }
.spoke {
  position: absolute; left: 359px; top: 16px; width: 2px; height: 196px;
  transform-origin: 1px 344px;
  background: linear-gradient(180deg, transparent, var(--line-2) 30%, var(--line) 80%, transparent);
}

/* The sector pointed at: a soft wedge, a bright arc on its rim and a
   pointer on the hub, turning the short way round. */
.turn {
  position: absolute; inset: 0; border-radius: 50%; opacity: 0;
  transition: transform .16s cubic-bezier(.2, .8, .2, 1), opacity .12s;
}
#wedge {
  background: conic-gradient(from -22.5deg,
    color-mix(in srgb, var(--accent) 26%, transparent) 0deg 45deg, transparent 45deg 360deg);
  -webkit-mask: radial-gradient(circle, transparent 0 147px, #000 148px 343px, transparent 344px);
}
#arc {
  background: conic-gradient(from -20deg, var(--accent) 0deg 40deg, transparent 40deg 360deg);
  -webkit-mask: radial-gradient(circle, transparent 0 334px, #000 335px 342px, transparent 343px);
  filter: drop-shadow(0 0 8px var(--accent));
}
#needle::before {
  content: ""; position: absolute; left: 352px; top: 218px;
  border-left: 8px solid transparent; border-right: 8px solid transparent;
  border-bottom: 11px solid var(--accent);
  filter: drop-shadow(0 0 6px var(--accent));
}
body.picked .turn { opacity: 1; }

.item {
  position: absolute; width: 156px; height: 118px; margin: -59px 0 0 -78px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 8px; text-align: center; line-height: 1.15; font-size: 19px; color: var(--text-2);
  transition: transform .14s cubic-bezier(.2, .8, .2, 1), color .14s, opacity .14s;
}
.item .ic { width: 46px; height: 46px; color: var(--text-2); transition: color .14s, filter .14s; }
.item .state { font-size: 15px; color: var(--text-3); margin-top: -2px; }
.item .state.yes { color: var(--good); }
.item.on { color: var(--text); transform: scale(1.12); }
.item.on .ic { color: var(--accent); filter: drop-shadow(0 0 10px var(--accent)); }
.item.off { opacity: .32; }

#hub {
  position: absolute; left: 230px; top: 230px; width: 260px; height: 260px; border-radius: 50%;
  background: radial-gradient(circle at 50% 28%, var(--surface-3), var(--surface-2) 72%);
  box-shadow: 0 0 0 1px var(--line-2), 0 0 44px var(--accent-soft), inset 0 -18px 40px rgba(0, 0, 0, .18);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 8px; text-align: center; padding: 0 28px;
}
#ring-name {
  font-size: 15px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase;
  color: var(--accent);
}
#pick-name { font-size: 28px; font-weight: 600; color: var(--text); line-height: 1.12; }
#pick-name.none { font-size: 21px; font-weight: 400; color: var(--text-2); }
#pick-detail { font-size: 17px; color: var(--text-2); min-height: 20px; }
#hint { font-size: 14px; color: var(--text-3); line-height: 1.3; }
</style></head><body class="hidden">
<!--#include icons.svg-->
<div id="all">
  <div class="orbit" id="rim"></div>
  <div class="orbit" id="inner"></div>
  <div id="spokes"></div>
  <div class="turn" id="wedge"></div>
  <div class="turn" id="arc"></div>
  <div class="turn" id="needle"></div>
  <div id="items"></div>
  <div id="hub">
    <div id="ring-name"></div>
    <div id="pick-name"></div>
    <div id="pick-detail"></div>
    <div id="hint">Solta para escolher<br>○ fechar</div>
  </div>
</div>
<script>
<!--#include lang.js-->
</script>
<script>
'use strict';
// main.cpp's sectors (GO_*, PAGE_*), in the same order.
const RINGS = {
  go: {trigger: 'L2', name: 'Ir para', items: [
    {icon: 'home', label: 'Início'},
    {icon: 'star', label: 'Favoritos'},
    {icon: 'history', label: 'Histórico'},
    {icon: 'arrow-download', label: 'Transferências'},
    {icon: 'settings', label: 'Definições'},
    {icon: 'apps', label: 'Separadores'},
    {icon: 'search', label: 'Pesquisar'},
    {icon: 'add', label: 'Adicionar favorito', when: 'canFavorite', favorite: true},
  ]},
  page: {trigger: 'R2', name: 'Página', items: [
    {icon: 'arrow-clockwise', label: 'Recarregar'},
    {icon: 'zoom-in', label: 'Ampliar', zoom: true},
    {icon: 'arrow-right', label: 'Avançar', when: 'canForward'},
    {icon: 'shield-checkmark', label: 'Anúncios aqui', toggle: 'adblock', yes: 'Bloqueados', no: 'Permitidos', when: 'canAds'},
    {icon: 'full-screen-maximize', label: 'Ecrã inteiro', toggle: 'fullscreen', yes: 'Ligado', no: 'Desligado'},
    {icon: 'weather-moon', label: 'Modo escuro', toggle: 'dark_sites', yes: 'Ligado', no: 'Desligado'},
    {icon: 'arrow-left', label: 'Voltar', when: 'canBack'},
    {icon: 'zoom-out', label: 'Reduzir', zoom: true},
  ]},
};
const RADIUS = 252, CENTER = 360;
let state = {ring: 'go', theme: 'meia-noite', zoom: 100, adblock: true, dark_sites: false,
             fullscreen: false, canFavorite: false, canBack: false, canForward: false,
             favorite: false, pick: -1};
let angle = 0;  // the wedge's, unwrapped: it turns the short way

const spokes = document.getElementById('spokes');
for (let i = 0; i < 8; i++) {
  const s = document.createElement('div');
  s.className = 'spoke';
  s.style.transform = 'rotate(' + (22.5 + 45 * i) + 'deg)';
  spokes.appendChild(s);
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
function icon(name) {
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('class', 'ic');
  const use = document.createElementNS('http://www.w3.org/2000/svg', 'use');
  use.setAttribute('href', '#i-' + name);
  svg.appendChild(use);
  return svg;
}

// An item's words as shown now: the favorite's turn, a switch's state.
function label(item) {
  if (item.favorite && state.favorite) return 'Tirar favorito';
  return item.label;
}
function detail(item) {
  if (item.toggle) return state[item.toggle] ? item.yes : item.no;
  if (item.zoom) return state.zoom + '%';
  return '';
}
function enabled(item) {
  return !item.when || !!state[item.when];
}

function render() {
  const ring = RINGS[state.ring] || RINGS.go;
  const items = document.getElementById('items');
  items.textContent = '';
  ring.items.forEach((item, i) => {
    const a = i * Math.PI / 4;
    const b = el('div', 'item');
    b.style.left = (CENTER + RADIUS * Math.sin(a)) + 'px';
    b.style.top = (CENTER - RADIUS * Math.cos(a)) + 'px';
    b.appendChild(icon(item.favorite && state.favorite ? 'star-f' : item.icon));
    b.appendChild(el('div', '', label(item)));
    if (item.toggle) b.appendChild(el('div', 'state' + (state[item.toggle] ? ' yes' : ''), detail(item)));
    b.classList.toggle('off', !enabled(item));
    b.classList.toggle('on', i === state.pick);
    items.appendChild(b);
  });
  document.getElementById('ring-name').textContent = ring.trigger + ' · ' + T(ring.name);
  const name = document.getElementById('pick-name');
  const item = ring.items[state.pick];
  if (item) {
    name.textContent = label(item);
    name.className = '';
    document.getElementById('pick-detail').textContent =
      enabled(item) ? detail(item) : 'Agora não';
  } else {
    name.textContent = 'Aponta com o manípulo ou o D-pad';
    name.className = 'none';
    document.getElementById('pick-detail').textContent = '';
  }
  document.body.classList.toggle('picked', !!item);
  if (item) {
    const target = state.pick * 45;
    angle += ((target - angle) % 360 + 540) % 360 - 180;
    for (const id of ['wedge', 'arc', 'needle'])
      document.getElementById(id).style.transform = 'rotate(' + angle + 'deg)';
  }
}

// From the app.
function setTheme(name) {
  document.documentElement.dataset.theme = name;
  state.theme = name;
}
function show(s) {
  Object.assign(state, {favorite: false}, s, {pick: -1});
  document.documentElement.dataset.theme = state.theme;
  render();
  document.body.classList.remove('hidden');
}
function pick(i) {
  if (i !== -1 && document.body.classList.contains('picked') === false) {
    // The first: no turn in from where the last opening left it.
    angle = i * 45;
    for (const id of ['wedge', 'arc', 'needle']) {
      const e = document.getElementById(id);
      e.style.transition = 'none';
      e.style.transform = 'rotate(' + angle + 'deg)';
      void e.offsetWidth;
      e.style.transition = '';
    }
  }
  state.pick = i;
  render();
}
function setFavorite(on) {
  state.favorite = !!on;
  render();
}
function hide() {
  document.body.classList.add('hidden');
  state.pick = -1;
  document.body.classList.remove('picked');
}
render();
</script></body></html>
