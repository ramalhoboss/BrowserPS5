<!-- Copyright (C) 2026 BrowserPS5 contributors. GPL-3.0-or-later.

The browser's own keyboard, a page of its own drawn by WebKit over the bottom
KEYS_HEIGHT pixels of the screen (main.cpp). The system keyboard cannot open
while the title draws with the GPU: it took the console down (2026-11-04
18:19, docs/03-video-e-gpu.md).

The app opens it with kb.open({kind, enter, text, logins}) and hides it again when
it sends browserps5:done?<text> or browserps5:cancel (navigations the app
never lets happen, as the bar's). What is typed stays here until then: the
app puts it into the field in one go, as it did with the system keyboard's.

The controller (main.cpp, keys_input()): the D-pad moves the highlight
(kb.move) and cross or square press that key (kb.pressHighlighted); with
the cursor on the keyboard and no D-pad since the stick moved, cross clicks
the key under it; circle deletes (kb.backspace); triangle closes
(kb.cancel); R1 is the Enter key (kb.done).

logins: the user names saved for the page's origin (main.cpp,
logins_for_keys(); docs/12-contas.md), as "Entrar como ..." keys in the top
row, the first one highlighted: pressed, browserps5:login?<index>, and the
app fills the page's fields itself (no password ever comes here). -->

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font: 26px/1.35 "SST", "SST Roman", "Segoe UI Variable Text", "Segoe UI", "DejaVu Sans", sans-serif;
  color: var(--text); background: var(--bg);
  -webkit-font-smoothing: antialiased; user-select: none; overflow: hidden;
}
button, input { font: inherit; color: inherit; }
button { border: 0; background: none; padding: 0; margin: 0; cursor: pointer; }
.ic { width: 32px; height: 32px; fill: currentColor; flex: none; display: block; }
.ic.s { width: 26px; height: 26px; }
.ic.l { width: 40px; height: 40px; }

/* A round button with an icon. */
.ib {
  width: 64px; height: 64px; border-radius: 50%; flex: none;
  display: grid; place-items: center; color: var(--text-2);
  transition: background .12s, color .12s, transform .12s;
}
.ib:hover { background: var(--surface-3); color: var(--text); }
.ib:active { transform: scale(.93); background: var(--surface-4); }
.ib[disabled] { opacity: .32; pointer-events: none; }

/* Text buttons. */
.btn {
  height: 60px; padding: 0 28px; border-radius: 30px; display: inline-flex;
  align-items: center; gap: 12px; background: var(--surface-3); color: var(--text);
  font-weight: 600; transition: background .12s, transform .12s;
}
.btn:hover { background: var(--surface-4); }
.btn:active { transform: scale(.97); }
.btn.primary { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: var(--on-accent); }
.btn.danger { background: rgba(255, 93, 108, .14); color: var(--bad); }

/* An on/off switch. */
.switch {
  width: 76px; height: 42px; border-radius: 21px; flex: none; position: relative;
  background: var(--surface-4); transition: background .18s;
}
.switch::after {
  content: ""; position: absolute; top: 5px; left: 5px; width: 32px; height: 32px;
  border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0, 0, 0, .35);
  transition: transform .18s;
}
.on > .switch, .switch.on { background: linear-gradient(135deg, var(--accent), var(--accent-2)); }
.on > .switch::after, .switch.on::after { transform: translateX(34px); }

/* A letter for a site with no picture of its own. */
.avatar {
  width: 44px; height: 44px; border-radius: 14px; flex: none; display: grid;
  place-items: center; font-weight: 700; color: #fff; font-size: 22px;
}

.dim { color: var(--text-2); }
.faint { color: var(--text-3); }

/* ---- 2026-11-09: "Noir", the premium layer (docs/27-design-premium.md) ----
   Over every theme: smoked glass (a sheen from the top, a lit hairline at the
   upper edge), deep soft shadows, light type with air, the accent kept for
   light and focus, and a chrome like the app's icon. Selectors without quotes
   on purpose: gen_native_assets.py reads only the quoted theme blocks. */
:root {
  --ease: cubic-bezier(.2, .8, .2, 1);
  --sheen: linear-gradient(180deg, rgba(255, 255, 255, .075) 0%, rgba(255, 255, 255, .018) 42%, rgba(255, 255, 255, 0) 72%);
  --edge: inset 0 1px 0 rgba(255, 255, 255, .09), inset 0 0 0 1px rgba(255, 255, 255, .045);

[data-theme=claro] {
  --sheen: linear-gradient(180deg, rgba(255, 255, 255, .95) 0%, rgba(255, 255, 255, .45) 42%, rgba(255, 255, 255, 0) 72%);
  --edge: inset 0 1px 0 rgba(255, 255, 255, .95), inset 0 0 0 1px rgba(10, 20, 40, .05);
  --lift: 0 34px 70px -24px rgba(20, 30, 60, .28), 0 12px 26px -10px rgba(20, 30, 60, .16);
  --metal: linear-gradient(180deg, #4a5262 0%, #1d222c 50%, #0b0e14 100%);
  --vignette: none;
}

/* Glass buttons and switches, lit at the top. */
.ib { transition: background .2s var(--ease), color .2s var(--ease), transform .2s var(--ease), box-shadow .2s var(--ease); }
.ib:hover { background: var(--sheen), var(--surface-3); box-shadow: var(--edge); }
.btn { background: var(--sheen), var(--surface-3); box-shadow: var(--edge); letter-spacing: .01em; transition: background .2s var(--ease), transform .2s var(--ease), box-shadow .2s var(--ease); }
.btn:hover { background: var(--sheen), var(--surface-4); box-shadow: var(--edge), 0 10px 26px -12px rgba(0, 0, 0, .6); }
.btn.primary {
  background: linear-gradient(180deg, rgba(255, 255, 255, .22), rgba(255, 255, 255, 0) 55%), linear-gradient(135deg, var(--accent), var(--accent-2));
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .35), 0 14px 34px -12px var(--accent);
}
.switch { background: var(--surface-4); box-shadow: inset 0 2px 6px rgba(0, 0, 0, .45), inset 0 0 0 1px rgba(255, 255, 255, .05); transition: background .25s var(--ease), box-shadow .25s var(--ease); }
.switch::after { background: linear-gradient(180deg, #ffffff, #e3e7ee); box-shadow: 0 3px 8px rgba(0, 0, 0, .45), inset 0 -1px 0 rgba(0, 0, 0, .08); transition: transform .28s var(--ease); }
.on > .switch, .switch.on {
  background: linear-gradient(180deg, rgba(255, 255, 255, .2), rgba(255, 255, 255, 0) 60%), linear-gradient(135deg, var(--accent), var(--accent-2));
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .3), 0 0 22px -4px var(--accent);
}
/* The site letters as small app icons: a gloss from the top, a fine ring. */
.avatar { position: relative; letter-spacing: 0; text-shadow: 0 1px 2px rgba(0, 0, 0, .3); }
.avatar::after {
  content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  background: linear-gradient(180deg, rgba(255, 255, 255, .32) 0%, rgba(255, 255, 255, .06) 46%, rgba(0, 0, 0, .12) 100%);

:root { --height: 440px; }
html, body {
  height: var(--height); overflow: hidden; background: transparent;
  font-size: 30px; -webkit-user-select: none; user-select: none;
}
#board {
  height: var(--height); padding: 16px 30px 18px;
  display: flex; flex-direction: column; gap: 9px;
  background: linear-gradient(180deg, var(--surface-2) 0%, var(--surface) 100%);
  border-top: 1px solid var(--line-2);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .04);
}
#top { flex: none; height: 74px; display: flex; align-items: center; gap: 18px; }
#label {
  flex: none; width: 250px; color: var(--text-3); font-size: 20px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 1.4px;
}
#preview {
  flex: 1; height: 66px; padding: 0 28px;
  border-radius: 33px; background: var(--bg); overflow: hidden;
  display: flex; align-items: center; border: 1px solid var(--accent);
  box-shadow: var(--glow);
}
#line { white-space: pre; position: relative; color: var(--text); }
#caret {
  display: inline-block; width: 3px; height: 40px; margin: 0 -1px;
  vertical-align: middle; background: var(--accent); border-radius: 2px;
}
/* The caret blinks from a timer (blink()), not a CSS animation: see there. */
#caret.off { visibility: hidden; }
#placeholder { color: var(--text-3); }
#show { flex: none; }
#legend { flex: none; color: var(--text-3); font-size: 20px; line-height: 29px; text-align: right; }
#top .row.logins { flex: 0 1 auto; height: 62px; max-width: 1100px; min-width: 0; }
.key.login {
  flex: 0 1 auto; min-width: 0; padding: 0 28px; font-size: 24px; font-weight: 600;
  background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: var(--on-accent);
  overflow: hidden; text-overflow: ellipsis;
}
body.logins #legend { display: none; }
.row { flex: 1; display: flex; gap: 9px; }
.key {
  flex: 1 1 0; display: flex; align-items: center; justify-content: center;
  border-radius: 14px; color: var(--text);
  background: linear-gradient(180deg, var(--surface-4) 0%, var(--surface-3) 100%);
  box-shadow: 0 2px 0 rgba(0, 0, 0, .28), inset 0 1px 0 rgba(255, 255, 255, .05);
  font: inherit; white-space: nowrap; overflow: hidden;
}
.key.fn { background: var(--surface-2); color: var(--text-2); font-size: 25px; }
.key.on { color: var(--accent); }
.key.hl { box-shadow: 0 0 0 3px var(--accent), 0 0 22px var(--accent-soft); color: var(--text); }
.key.down { background: var(--accent); color: var(--on-accent); }
.key.enter { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: var(--on-accent); font-weight: 700; }
.key.enter.hl { box-shadow: 0 0 0 3px var(--text), 0 0 22px var(--accent-soft); }

  const re = pt.split(/(%s|%d)/).map(p => p === '%s' ? '([\\s\\S]+?)' : p === '%d' ? '(\\d+)'

  return [new RegExp('^' + re + '$'), en];
});

const LANG_DAYS = {
  pt: ['domingo', 'segunda-feira', 'terça-feira', 'quarta-feira', 'quinta-feira', 'sexta-feira', 'sábado'],
  en: ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'],
};
const LANG_MONTHS = {
  pt: ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro',
       'outubro', 'novembro', 'dezembro'],
  en: ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September',
       'October', 'November', 'December'],
};
const LANG_ATTRS = ['title', 'placeholder', 'aria-label'];

// The English of text (its spaces at both ends kept), or null.
function langEn(text) {
  const t = text.trim();
  if (!t) return null;
  let en = Object.prototype.hasOwnProperty.call(LANG_EN, t) ? LANG_EN[t] : null;
  for (let i = 0; en === null && i < LANG_EN_PATTERNS.length; i++) {
    const m = LANG_EN_PATTERNS[i][0].exec(t);
    if (m) {
      let n = 1;
      en = LANG_EN_PATTERNS[i][1].replace(/%[sd]/g, () => {
        const part = m[n++];
        return Object.prototype.hasOwnProperty.call(LANG_EN, part) ? LANG_EN[part] : part;
      });
    }
  }
  if (en === null) return null;
  return text.slice(0, text.length - text.trimStart().length) + en + text.slice(text.trimEnd().length);
}

function T(text, ...args) {
  const context = /^[a-z]+\|/.exec(text);
  const plain = context ? text.slice(context[0].length) : text;
  let s = LANG === 'en' ? (langEn(text) ?? (context ? langEn(plain) : null)) : null;
  if (s === null) s = plain;
  let n = 0;
  return args.length ? s.replace(/%[sd]/g, () => String(args[n++])) : s;
}

// "sábado, 6 de março", "Saturday, 6 March".
function langDay(d) {
  return LANG === 'en'
    ? LANG_DAYS.en[d.getDay()] + ', ' + d.getDate() + ' ' + LANG_MONTHS.en[d.getMonth()]
    : LANG_DAYS.pt[d.getDay()] + ', ' + d.getDate() + ' de ' + LANG_MONTHS.pt[d.getMonth()];
}

// What was swapped, to put it back: text node -> [pt, en]; element ->
// {attribute: [pt, en]}.
const langTexts = new WeakMap();
const langElements = new WeakMap();
let langObserver = null;

function langSkip(n) {
  const e = n.nodeType === 1 ? n : n.parentElement;
  return !e || e.closest('script, style, [translate="no"]') !== null;
}

function langNode(n) {
  if (n.nodeType === 3) {
    if (langSkip(n)) return;
    const en = langEn(n.data);
    if (en !== null && en !== n.data) {
      langTexts.set(n, [n.data, en]);
      n.data = en;
    }
    return;
  }
  if (n.nodeType !== 1 || langSkip(n)) return;
  const done = langElements.get(n) || {};
  if (n.hasAttribute('data-en') && !done.html) {
    done.html = [n.innerHTML, n.getAttribute('data-en')];
    langElements.set(n, done);
    n.innerHTML = done.html[1];
    return;
  }
  for (const a of LANG_ATTRS) {
    const v = n.getAttribute(a);
    const en = v ? langEn(v) : null;
    if (en !== null && en !== v) {
      done[a] = [v, en];
      langElements.set(n, done);
      n.setAttribute(a, en);
    }
  }
  for (let c = n.firstChild; c; c = c.nextSibling) langNode(c);
}

function langRestore(n) {
  if (n.nodeType === 3) {
    const was = langTexts.get(n);
    if (was && n.data === was[1]) n.data = was[0];
    langTexts.delete(n);
    return;
  }
  if (n.nodeType !== 1) return;
  const done = langElements.get(n);
  if (done) {
    langElements.delete(n);
    if (done.html) {
      n.innerHTML = done.html[0];
      return;
    }
    for (const a of LANG_ATTRS) {
      if (done[a] && n.getAttribute(a) === done[a][1]) n.setAttribute(a, done[a][0]);
    }
  }
  for (let c = n.firstChild; c; c = c.nextSibling) langRestore(c);
}

function setLang(lang) {
  lang = lang === 'en' ? 'en' : 'pt';
  if (lang === LANG) return;
  LANG = lang;
  document.documentElement.lang = lang;
  if (lang === 'en') {
    langNode(document.documentElement);
    langObserver = new MutationObserver(records => {
      for (const r of records) {
        if (r.type === 'childList') r.addedNodes.forEach(langNode);
        else if (r.type === 'characterData') langNode(r.target);
        else if (LANG_ATTRS.includes(r.attributeName)) langNode(r.target);
      }
    });
    langObserver.observe(document.documentElement, {
      childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: LANG_ATTRS,
    });
  } else {
    if (langObserver) langObserver.disconnect();
    langObserver = null;
    langRestore(document.documentElement);
  }
  // For the pages' texts put together before (settings.html, start.html).
  document.dispatchEvent(new Event('langchange'));
}

    ['q', 'w', 'e', 'r', 't', 'y', 'u', 'i', 'o', 'p', "'"],
    ['a', 's', 'd', 'f', 'g', 'h', 'j', 'k', 'l', 'ç', '~'],
    [{k: 'shift', t: '⇧', w: 1.6}, 'z', 'x', 'c', 'v', 'b', 'n', 'm', ',', '.', '-'],
  ],
  acc: [
    ['1', '2', '3', '4', '5', '6', '7', '8', '9', '0', BKSP],
    ['á', 'à', 'â', 'ã', 'é', 'è', 'ê', 'í', 'ì', 'î', 'ï'],
    ['ó', 'ò', 'ô', 'õ', 'ö', 'ú', 'ù', 'û', 'ü', 'ç', 'ñ'],
    [{k: 'shift', t: '⇧', w: 1.6}, 'ä', 'ë', 'ÿ', '«', '»', 'ª', 'º', '€', '£', '°'],
  ],
  sym: [
    ['1', '2', '3', '4', '5', '6', '7', '8', '9', '0', BKSP],
    ['!', '@', '#', '$', '%', '&', '*', '(', ')', '=', '+'],
    ['-', '_', '/', '\\', ':', ';', '"', "'", '?', '¿', '¡'],
    ['[', ']', '{', '}', '<', '>', '|', '^', '`', '§', ','],
  ],
};

// The bottom row's own keys for each kind of field.
const extras = {
  bar: ['/', '.com', '.pt', 'www.'],
  url: ['/', '.com', '.pt', 'www.'],
  email: ['@', '.com', '.pt', '_'],
  search: ['@', '?', '!'],
  text: ['@', '?', '!'],
  password: ['@', '_', '!', '#'],
  tel: ['+', '*', '#'],
  number: ['.', ',', '-'],
  textarea: ['@', '?', {k: 'newline', t: '↵ linha'}],
  edit: ['@', '?', {k: 'newline', t: '↵ linha'}],
};

const labels = {
  bar: 'Endereço ou pesquisa', url: 'Endereço', email: 'E-mail',
  search: 'Pesquisa', text: 'Texto', password: 'Palavra-passe',
  tel: 'Telefone', number: 'Número', textarea: 'Texto', edit: 'Texto',
};

const enterLabels = {
  go: 'Ir', search: 'Pesquisar', send: 'Enviar', next: 'Seguinte',
  done: 'OK', enter: 'OK', previous: 'OK', '': 'OK',
};

const s = {
  open: false, kind: 'text', enter: '', chars: [], caret: 0,
  layer: 'abc', shift: 0,   // 0 off, 1 the next letter, 2 locked
  reveal: false,            // a password shown as it is
  hl: null,                 // the highlighted key (an element)
  logins: [],               // "Entrar como ...": user names (kb.open)
};

const board = document.getElementById('board');
const line = document.getElementById('line');
const preview = document.getElementById('preview');
const label = document.getElementById('label');

function send(command, argument) {
  location.href = 'browserps5:' + command +
    (argument === undefined ? '' : '?' + encodeURIComponent(argument));
}

function keyText(key) {
  if (typeof key !== 'string')
    return key.t;
  return s.shift && s.layer !== 'sym' ? key.toUpperCase() : key;
}

// The rows of the layer in use, and the bottom one.
function rows() {
  const r = layers[s.layer].slice();
  const bottom = [
    s.layer === 'sym' ? {k: 'abc', t: 'abc', w: 1.4} : {k: 'sym', t: '?123', w: 1.4},
    s.layer === 'acc' ? {k: 'abc', t: 'abc', w: 1.4} : {k: 'acc', t: 'áé', w: 1.4},
  ];
  for (const e of extras[s.kind] || extras.text)
    bottom.push(typeof e === 'string' ? e : Object.assign({w: 1.6}, e));
  if (s.kind === 'password')
    bottom.push({k: 'reveal', t: s.reveal ? 'ocultar' : 'mostrar', w: 1.6});
  bottom.push({k: 'space', t: 'espaço', w: 3.5},
              {k: 'left', t: '←'}, {k: 'right', t: '→'},
              {k: 'close', t: 'fechar', w: 1.6},
              {k: 'enter', t: enterLabels[s.enter] || 'OK', w: 2.2});
  r.push(bottom);
  return r;
}

// Draws the keys again (a layer, shift or the kind changed), keeping the
// highlight at the same place.
function makeKey(key, r, c) {
  const e = document.createElement('div');
  e.className = 'key';
  e.dataset.row = r;
  e.dataset.col = c;
  e.textContent = keyText(key);
  if (typeof key !== 'string' && key.k === 'login') {
    e.classList.add('login');
  } else if (typeof key !== 'string') {
    e.classList.add(key.k === 'enter' ? 'enter' : 'fn');
    e.style.flexGrow = key.w || 1;
    if ((key.k === 'shift' && s.shift) ||
        (key.k === s.layer))
      e.classList.add('on');
  } else if (key.length > 1) {
    e.classList.add('fn');
    e.style.flexGrow = 1.4;
  }
  e.key = key;
  e.addEventListener('mousedown', down);
  e.addEventListener('mouseup', up);
  e.addEventListener('mouseleave', up);
  e.addEventListener('mouseenter', () => highlight(e));
  return e;
}

function build() {
  // The logins' row (in the top one) is row 0 when there is one.
  const offset = s.logins.length ? 1 : 0;
  const at = s.hl ? [+s.hl.dataset.row, +s.hl.dataset.col] : [offset ? 0 : 1, 0];
  for (const old of board.querySelectorAll('.row'))
    old.remove();
  document.body.classList.toggle('logins', !!offset);
  if (offset) {
    const row = document.createElement('div');
    row.className = 'row logins';
    s.logins.forEach((name, i) => row.appendChild(makeKey({k: 'login', i, t: 'Entrar como ' + name}, 0, i)));
    document.getElementById('top').appendChild(row);
  }
  rows().forEach((keys, r) => {
    const row = document.createElement('div');
    row.className = 'row';
    keys.forEach((key, c) => row.appendChild(makeKey(key, r + offset, c)));
    board.appendChild(row);
  });
  const all = board.querySelectorAll('.row');
  const row = all[Math.min(at[0], all.length - 1)];
  highlight(row.children[Math.min(at[1], row.children.length - 1)]);
}

function highlight(e) {
  if (s.hl)
    s.hl.classList.remove('hl');
  s.hl = e;
  if (e)
    e.classList.add('hl');
}

// What is typed, with the caret, scrolled so that the caret shows.
function render() {
  document.body.classList.toggle('closed', !s.open);
  label.textContent = labels[s.kind] || labels.text;
  line.textContent = '';
  // One line: a new line shows as ↵.
  const shown = s.kind === 'password' && !s.reveal
    ? s.chars.map(() => '•') : s.chars.map(c => c === '\n' ? '↵' : c);
  if (!s.chars.length) {
    const p = document.createElement('span');
    p.id = 'placeholder';
    p.textContent = s.kind === 'bar' ? T('Pesquisar ou escrever um endereço') : '';
    line.append(caretElement(), p);
  } else {
    line.append(document.createTextNode(shown.slice(0, s.caret).join('')),
                caretElement(),
                document.createTextNode(shown.slice(s.caret).join('')));
  }
  const caret = document.getElementById('caret');
  const room = preview.clientWidth - 48;
  const x = caret.offsetLeft;
  const shift = Math.max(0, x - room + 40);
  line.style.left = -shift + 'px';
  blink();
}

// The caret blinks from a timer, two changes a second, and only while the
// keyboard is open. A CSS animation runs on WebKit's compositor: the page
// made a frame every 16 ms while the keyboard was open (each one read back
// from the GPU), and closing the page during one crashed the WebProcess
// (2026-11-05 00:53, docs/06). Each render() shows the caret again.
let blinkTimer = 0;
function blink() {
  clearInterval(blinkTimer);
  blinkTimer = 0;
  if (s.open) {
    blinkTimer = setInterval(() => {
      const caret = document.getElementById('caret');
      if (caret) {
        caret.classList.toggle('off');
      }
    }, 530);
  }
}

function caretElement() {
  const c = document.createElement('span');
  c.id = 'caret';
  return c;
}

function insert(text) {
  const add = Array.from(text);
  s.chars.splice(s.caret, 0, ...add);
  s.caret += add.length;
  if (s.shift === 1) {
    s.shift = 0;
    build();
  }
  render();
}

function backspace() {
  if (s.caret > 0) {
    s.chars.splice(s.caret - 1, 1);
    s.caret--;
    render();
  }
}

// A key pressed: with the cursor (down) or square (the highlighted one).
function press(key) {
  if (typeof key === 'string') {
    insert(keyText(key));
    return;
  }
  switch (key.k) {
  case 'bksp': backspace(); break;
  case 'space': insert(' '); break;
  case 'newline': insert('\n'); break;
  case 'left': s.caret = Math.max(0, s.caret - 1); render(); break;
  case 'right': s.caret = Math.min(s.chars.length, s.caret + 1); render(); break;
  case 'shift': s.shift = (s.shift + 1) % 3; build(); break;
  case 'sym': case 'acc': case 'abc':
    s.layer = key.k; s.shift = 0; build(); break;
  case 'reveal': s.reveal = !s.reveal; build(); render(); break;
  case 'close': kb.cancel(); break;
  case 'enter': kb.done(); break;
  case 'login': {
    const i = key.i;
    reset();
    send('login', String(i));
    break;
  }
  default: insert(key.t);
  }
}

// Held down, ⌫ and the arrows repeat.
let repeat = 0;
function down(event) {
  event.preventDefault();
  const e = event.currentTarget;
  highlight(e);
  e.classList.add('down');
  press(e.key);
  const k = e.key.k;
  if (k === 'bksp' || k === 'left' || k === 'right') {
    clearTimeout(repeat);
    const again = () => { press(e.key); repeat = setTimeout(again, 70); };
    repeat = setTimeout(again, 450);
  }
}

function up(event) {
  event.currentTarget.classList.remove('down');
  clearTimeout(repeat);
}

// The key in the next row (dy) or the next one in this row (dx) from the
// highlighted one. Up and down go to the key whose middle is nearest.
function move(dx, dy) {
  const all = Array.from(board.querySelectorAll('.row'));
  if (!s.hl) {
    highlight(all[0].children[0]);
    return;
  }
  let r = +s.hl.dataset.row;
  let c = +s.hl.dataset.col;
  if (dx) {
    const n = all[r].children.length;
    c = (c + (dx > 0 ? 1 : -1) + n) % n;
    highlight(all[r].children[c]);
    return;
  }
  if (dy) {
    const middle = s.hl.offsetLeft + s.hl.offsetWidth / 2;
    r = (r + (dy > 0 ? 1 : -1) + all.length) % all.length;
    let best = null;
    let bestDistance = 1e9;
    for (const e of all[r].children) {
      const d = Math.abs(e.offsetLeft + e.offsetWidth / 2 - middle);
      if (d < bestDistance) {
        best = e;
        bestDistance = d;
      }
    }
    highlight(best);
  }
}

function flash(e) {
  if (!e)
    return;
  e.classList.add('down');
  setTimeout(() => e.classList.remove('down'), 120);
}

function reset() {
  s.open = false;
  s.logins = [];
  s.chars = [];
  s.caret = 0;
  s.reveal = false;
  render();
}

// What the app calls.
window.kb = {
  // kind: bar, text, search, url, email, tel, password, number, textarea or
  // edit; enter: the field's enterkeyhint (go, search, send, next, done or
  // ''); text: what the field has.
  open(o) {
    s.open = true;
    s.kind = labels[o.kind] ? o.kind : 'text';
    s.enter = o.kind === 'bar' ? 'go' : (o.enter || '');
    s.chars = Array.from(o.text || '');
    s.caret = s.chars.length;
    s.layer = s.kind === 'number' || s.kind === 'tel' ? 'sym' : 'abc';
    s.shift = 0;
    s.reveal = false;
    s.hl = null;
    s.logins = Array.isArray(o.logins) ? o.logins.slice(0, 3).map(String) : [];
    build();
    render();
  },
  move,
  pressHighlighted() {
    if (s.hl) {
      flash(s.hl);
      press(s.hl.key);
    }
  },
  backspace,
  done() {
    const text = s.chars.join('');
    reset();
    send('done', text);
  },
  cancel() {
    reset();
    send('cancel');
  },
};

// From the app: the theme (theme.css).
window.setTheme = (name) => { document.documentElement.dataset.theme = name; };

build();
render();
</script></body></html>
